<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HexaPrep</title>
    <meta name="theme-color" content="#B05A8F" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HexaPrep" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
  <style>html{background:#FBF9F6}@media (prefers-color-scheme:dark){html:not([data-theme="light"]){background:#17131A}}html[data-theme="dark"]{background:#17131A}</style>
  </head>
  <body>
    <script>try{var t=localStorage.getItem("hexaprep.tema");if(t==="claro"||t==="oscuro")document.documentElement.setAttribute("data-theme",t==="claro"?"light":"dark")}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
