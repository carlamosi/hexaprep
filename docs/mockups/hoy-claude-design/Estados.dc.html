<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hoy A, estados</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.fila:hover{background:rgba(142,63,112,.08)}
.fila:focus-visible,.btn:focus-visible{outline:3px solid #8E3F70;outline-offset:-3px}
.btn{transition:transform .16s cubic-bezier(.2,.7,.2,1)}
.btn:active{transform:scale(.97)}
</style>
</helmet>
<div style="width: 390px; box-sizing: border-box; font-family: 'Lexend', system-ui, sans-serif; background: #FBF9F6; color: #231D27; display: flex; flex-direction: column; gap: 14px; padding: 24px 16px 40px">

  <p style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #554C5A">Sin sugerencias todavía</p>
  <section aria-label="Sin sugerencias" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 24px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px #ECE6E9; text-align: center">
    <svg viewBox="0 0 92 80" width="92" height="80" aria-hidden="true"><polygon points="76,40 61,66 31,66 16,40 31,14 61,14" fill="none" stroke="#8F8195" stroke-width="2.5" stroke-dasharray="5 5" stroke-linejoin="round"/></svg>
    <h2 style="margin: 0; font-size: 19px; font-weight: 600; text-wrap: balance">Aquí aparecerá qué repasar</h2>
    <p style="margin: 0; max-width: 280px; font-size: 14px; line-height: 1.5; color: #554C5A">Todavía no hay sugerencias: practica un rato y aquí verás qué repasar.</p>
    <a href="#panal" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border: 1px solid #DAD1D6; border-radius: 12px; background: #FFFFFF; color: #8E3F70; font-size: 16px; font-weight: 500; text-decoration: none">Ir al panal</a>
  </section>

  <p style="margin: 22px 4px 0; font-size: 13px; font-weight: 600; color: #554C5A">Cargando (la silueta de lo que viene)</p>
  <div role="status" aria-busy="true" aria-label="Cargando Hoy" style="display: flex; flex-direction: column; gap: 14px">
    <div style="height: 300px; border-radius: 24px; background: linear-gradient(100deg, #ECE6E9 30%, #F8EEF4 50%, #ECE6E9 70%)"></div>
    <div style="border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #ECE6E9; overflow: hidden">
      <div style="height: 72px; display: flex; align-items: center; gap: 14px; padding: 0 16px"><span style="width: 40px; height: 35px; clip-path: polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); background: #ECE6E9"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><i style="display: block; width: 70%; height: 12px; border-radius: 6px; background: #ECE6E9"></i><i style="display: block; width: 45%; height: 10px; border-radius: 5px; background: #F1EBEF"></i></span></div>
      <div style="height: 72px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-top: 1px solid #ECE6E9"><span style="width: 40px; height: 35px; clip-path: polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); background: #ECE6E9"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><i style="display: block; width: 62%; height: 12px; border-radius: 6px; background: #ECE6E9"></i><i style="display: block; width: 40%; height: 10px; border-radius: 5px; background: #F1EBEF"></i></span></div>
    </div>
  </div>

  <p style="margin: 22px 4px 0; font-size: 13px; font-weight: 600; color: #554C5A">Tu plan con examen y tema puestos</p>
  <section aria-label="Tu plan" style="border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #ECE6E9; overflow: hidden">
    <button class="fila" type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; padding: 14px 16px; border: 0; background: none; font: 500 15px 'Lexend', system-ui, sans-serif; color: #231D27; text-align: left; cursor: pointer">
      <span aria-hidden="true" style="display: grid; place-items: center; flex: none; width: 64px; height: 56px; clip-path: polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); background: radial-gradient(circle at 50% 44%, rgba(226,127,184,.9) 0, rgba(176,90,143,.4) 55%, transparent 82%), linear-gradient(180deg, #7A3470, #4A1E4C 55%, #2A1030); color: #FFF6FB"><span style="display: flex; flex-direction: column; align-items: center; line-height: 1"><b style="font-size: 20px; font-weight: 600">20</b><small style="font-size: 10px">días</small></span></span>
      <span style="flex: 1"><span style="display: block">Examen, 12 de diciembre</span><span style="display: block; margin-top: 3px; font-size: 13px; font-weight: 400; line-height: 1.4; color: #6F6675">Faltan 20 días. Tienes 41 conceptos sin empezar: 3 al día para llegar con todo visto.</span></span>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="flex: none; fill: none; stroke: #6F6675; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="fila" type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; min-height: 68px; padding: 8px 16px; border: 0; border-top: 1px solid #ECE6E9; background: none; font: 500 15px 'Lexend', system-ui, sans-serif; color: #231D27; text-align: left; cursor: pointer">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="flex: none; fill: none; stroke: #8E3F70; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>
      <span style="flex: 1"><span style="display: block">Tema en curso: Verbs irregulars</span><span style="display: block; margin-top: 2px; font-size: 13px; font-weight: 400; line-height: 1.4; color: #6F6675">60 % a este tema, 30 % a repasos y 10 % a explorar.</span></span>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="flex: none; fill: none; stroke: #6F6675; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="fila" type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; min-height: 68px; padding: 8px 16px; border: 0; border-top: 1px solid #ECE6E9; background: none; font: 500 15px 'Lexend', system-ui, sans-serif; color: #231D27; text-align: left; cursor: pointer">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="flex: none; fill: none; stroke: #8E3F70; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>
      <span style="flex: 1"><span style="display: block">Notas de examen</span><span style="display: block; margin-top: 2px; font-size: 13px; font-weight: 400; line-height: 1.4; color: #6F6675">Última: 6,5, con el 31 % de dominio (4 nov).</span></span>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="flex: none; fill: none; stroke: #6F6675; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </section>
  <p style="margin: 0 4px; font-size: 12px; color: #6F6675">La cifra de días no cambia de color al acercarse: sin presión.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1750}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
