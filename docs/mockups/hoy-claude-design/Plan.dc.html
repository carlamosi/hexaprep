<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hoy A, hoja de Tu plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.btn{transition:transform .16s cubic-bezier(.2,.7,.2,1)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.campo:focus-visible{outline:3px solid #8E3F70;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 900px; box-sizing: border-box; overflow: hidden; font-family: 'Lexend', system-ui, sans-serif; background: #FBF9F6; color: #231D27">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 24px 16px; opacity: .5">
    <p style="margin: 0; font-size: 28px; font-weight: 600">Hoy</p>
    <div style="height: 300px; margin-top: 20px; border-radius: 24px; background: radial-gradient(circle at 30% 15%, #9B4488 0, #5A2556 50%, #2A1030 100%)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23,19,26,.5)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="pt" style="position: absolute; left: 0; right: 0; bottom: 0; top: 130px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 10px 20px 28px; border-radius: 28px 28px 0 0; background: #FBF9F6; overflow: hidden">
    <div aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #DAD1D6"></div>
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h2 id="pt" style="margin: 0; font-size: 22px; font-weight: 600">Tu plan</h2>
      <button class="btn" type="button" aria-label="Cerrar" style="display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: #ECE6E9; color: #231D27; cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>

    <section aria-labelledby="ex" style="padding: 16px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 0 0 1px #ECE6E9; display: flex; flex-direction: column; gap: 12px">
      <h3 id="ex" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 16px; font-weight: 600"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #8E3F70; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/></svg>Examen</h3>
      <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #554C5A">Pon la fecha y verás cuántos conceptos tocar cada día para llegar con todo visto. Es opcional.</p>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="fecha" style="font-size: 13px; font-weight: 500">Fecha del examen</label>
        <input class="campo" id="fecha" type="date" value="2026-12-12" style="box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 1px solid #DAD1D6; border-radius: 12px; background: #FFFFFF; color: #231D27; font: 400 16px 'Lexend', system-ui, sans-serif">
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <button class="btn" type="button" style="min-height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: #8E3F70; color: #FFFFFF; font: 500 16px 'Lexend', system-ui, sans-serif; box-shadow: 0 4px 0 #5A2556; cursor: pointer">Guardar</button>
        <button class="btn" type="button" style="min-height: 48px; padding: 0 18px; border: 1px solid #DAD1D6; border-radius: 12px; background: #FFFFFF; color: #554C5A; font: 500 15px 'Lexend', system-ui, sans-serif; cursor: pointer">Quitar fecha</button>
      </div>
    </section>

    <section aria-labelledby="tc" style="padding: 16px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 0 0 1px #ECE6E9; display: flex; flex-direction: column; gap: 12px">
      <h3 id="tc" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 16px; font-weight: 600"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #8E3F70; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>Tema en curso</h3>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="tema" style="font-size: 13px; font-weight: 500">Tema (opcional)</label>
        <div style="position: relative">
          <select class="campo" id="tema" style="appearance: none; width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 40px 0 14px; border: 1px solid #DAD1D6; border-radius: 12px; background: #FFFFFF; color: #231D27; font: 400 16px 'Lexend', system-ui, sans-serif"><option>Ninguno</option><option selected>Verbs irregulars</option></select>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="position: absolute; right: 14px; top: 15px; fill: none; stroke: #6F6675; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #6F6675">Si marcas un tema, la práctica mezclada le da el 60 %, un 30 % a repasos y un 10 % a explorar. Sin tema, todo sigue igual.</p>
    </section>

    <section aria-labelledby="nt" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 0 0 1px #ECE6E9">
      <h3 id="nt" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 15px; font-weight: 500"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #8E3F70; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>Notas de examen</h3>
      <button class="btn" type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid #DAD1D6; border-radius: 11px; background: #FFFFFF; color: #8E3F70; font: 500 14px 'Lexend', system-ui, sans-serif; cursor: pointer">Anotar una nota</button>
    </section>
  </section>
</div>
</x-dc>

</body>
</html>
