<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Acceso A, portada ciruela</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.g{transition:transform .16s cubic-bezier(.2,.7,.2,1),box-shadow .16s cubic-bezier(.2,.7,.2,1)}
.g:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.32)}
.g:active{transform:scale(.98)}
.g:focus-visible{outline:3px solid #FFF6FB;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 0 24px; font-family: 'Lexend', system-ui, sans-serif; color: #FBEFF6; background: radial-gradient(circle at 50% 36%, #9B4488 0, #5A2556 40%, #2A1030 85%)">
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 40px">
    <svg viewBox="-20 -20 280 280" width="272" height="272" aria-hidden="true">
      <defs>
        <radialGradient id="luz"><stop offset="0" stop-color="#E27FB8" stop-opacity=".9"/><stop offset=".55" stop-color="#B05A8F" stop-opacity=".35"/><stop offset="1" stop-color="#B05A8F" stop-opacity="0"/></radialGradient>
        <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6FB"/><stop offset=".55" stop-color="#F7C6E0"/><stop offset="1" stop-color="#E58FC0"/></linearGradient>
      </defs>
      <circle cx="120" cy="120" r="125" fill="url(#luz)"/>
      <sc-for list="{{sats}}" as="s" hint-placeholder-count="6">
        <g opacity="{{s.op}}"><polygon points="{{s.pts}}" fill="#F7C6E0" stroke="#F7C6E0" stroke-width="8" stroke-linejoin="round"/></g>
      </sc-for>
      <polygon points="{{hero}}" fill="url(#cuerpo)" stroke="url(#cuerpo)" stroke-width="18" stroke-linejoin="round"/>
    </svg>
    <div style="margin-top: 2px; font-size: 28px; font-weight: 600; letter-spacing: .03em">HexaPrep</div>
    <p lang="en" style="margin: 8px 0 0; font-size: 15px; color: rgba(251,239,246,.78); text-align: center">Master it, one hexagon at a time.</p>
  </div>
  <section style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 44px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.25">Entra con tu cuenta de Google</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: rgba(251,239,246,.78)">Tu progreso se guarda en tu cuenta y es el mismo en todos tus dispositivos.</p>
    <button class="g" type="button" style="margin-top: 8px; height: 56px; border: 0; border-radius: 28px; background: #FFFFFF; color: #1F1F1F; font: 500 16px 'Lexend', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.28)">
      <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuar con Google
    </button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const hex = (cx, cy, r) => Array.from({ length: 6 }, (_, i) => {
      const a = (Math.PI / 180) * 60 * i;
      return (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
    }).join(' ');
    const defs = [
      { a: -75, l: 96, r: 17, op: 0.95 }, { a: -20, l: 118, r: 11, op: 0.6 }, { a: 35, l: 100, r: 20, op: 0.9 },
      { a: 120, l: 112, r: 13, op: 0.55 }, { a: 165, l: 92, r: 18, op: 0.95 }, { a: 235, l: 124, r: 9, op: 0.5 },
    ];
    const sats = defs.map((s) => ({
      op: s.op,
      pts: hex(120 + s.l * Math.cos((Math.PI / 180) * s.a), 120 + s.l * Math.sin((Math.PI / 180) * s.a), s.r),
    }));
    return { sats, hero: hex(120, 120, 44) };
  }
}
</script>
</body>
</html>
