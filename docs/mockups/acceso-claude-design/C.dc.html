<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Acceso C, panal vivo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.g{transition:transform .16s cubic-bezier(.2,.7,.2,1),box-shadow .16s cubic-bezier(.2,.7,.2,1)}
.g:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #B05A8F}
.g:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #B05A8F}
.g:focus-visible{outline:3px solid #8E3F70;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Lexend', system-ui, sans-serif; color: #231D27; background: radial-gradient(circle at 50% 30%, #9B4488 0, #5A2556 42%, #2A1030 88%)">
  <header style="display: flex; align-items: center; gap: 10px; padding: 56px 24px 0; color: #FBEFF6">
    <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2.8 19.8 7.3v9.4L12 21.2 4.2 16.7V7.3Z" fill="#F7C6E0" stroke="#F7C6E0" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span style="font-size: 18px; font-weight: 600; letter-spacing: .02em">HexaPrep</span>
  </header>
  <div style="position: absolute; left: 0; right: 0; top: 112px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <svg viewBox="0 0 250 240" width="290" height="278" aria-hidden="true">
      <defs><radialGradient id="luz"><stop offset="0" stop-color="#E27FB8" stop-opacity=".55"/><stop offset="1" stop-color="#E27FB8" stop-opacity="0"/></radialGradient></defs>
      <circle cx="125" cy="120" r="125" fill="url(#luz)"/>
      <sc-for list="{{celdas}}" as="c" hint-placeholder-count="20">
        <polygon points="{{c.pts}}" fill="#F7C6E0" fill-opacity="{{c.nivel}}" stroke="#F7C6E0" stroke-opacity="{{c.borde}}" stroke-width="2" stroke-linejoin="round"/>
      </sc-for>
    </svg>
    <p style="margin: 0; padding: 0 40px; text-align: center; font-size: 14px; line-height: 1.45; color: rgba(251,239,246,.82)">Cada hexágono es un concepto del temario. Se rellena según lo que dominas.</p>
  </div>
  <section style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 28px 24px 36px; border-radius: 28px 28px 0 0; background: #FBF9F6; box-shadow: 0 -12px 40px rgba(20,6,24,.4); display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2">Entra con tu cuenta de Google</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #554C5A">Tu progreso se guarda en tu cuenta y es el mismo en todos tus dispositivos.</p>
    <button class="g" type="button" style="margin-top: 8px; height: 56px; border: 0; border-radius: 14px; background: #231D27; color: #FFFFFF; font: 500 16px 'Lexend', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: 3px 3px 0 #B05A8F">
      <span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      </span>
      Continuar con Google
    </button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const r = 29;
    const hex = (cx, cy, rr) => Array.from({ length: 6 }, (_, i) => {
      const a = (Math.PI / 180) * 60 * i;
      return (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1);
    }).join(' ');
    const niveles = [
      [.15,.55,.9,.3,.7],
      [.6,.95,.4,.8,.2],
      [.25,.7,1,.5,.12],
      [.85,.35,.65,.15,.45],
    ];
    const celdas = [];
    niveles.forEach((fila, rw) => fila.forEach((n, c) => {
      celdas.push({
        nivel: (0.1 + 0.8 * n).toFixed(2),
        borde: (0.35 + 0.5 * n).toFixed(2),
        pts: hex(r + 1.5 * r * c + 2, r + rw * 1.7320508 * r + (c % 2) * 0.8660254 * r + 8, r - 2.5),
      });
    }));
    return { celdas };
  }
}
</script>
</body>
</html>
