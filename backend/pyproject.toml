[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexaprep"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2", "alembic", "fsrs", "pydantic>=2", "psycopg[binary]", "tzdata"]

[project.optional-dependencies]
dev = ["pytest", "pdfplumber", "reportlab", "httpx"]

[tool.setuptools.packages.find]
include = ["hexaprep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
